<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wick &amp; Hour · Candles sold by how long they burn</title>
<meta name="description" content="Small-batch candles, poured by hand and sold by burn time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="main.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <a class="wordmark" href="#top">Wick &amp; Hour</a>
  <nav class="site-nav" aria-label="Primary">
    <a href="#scents">Scents</a>
    <a href="#making">Making</a>
    <a href="#about">About</a>
    <a href="#visit">Visit</a>
  </nav>
  <button class="bag-button" type="button" aria-controls="bag">Bag <span data-bag-count>0</span></button>
</header>

<main id="main">
  <section class="hero" aria-labelledby="hero-title">
    <h1 id="hero-title" class="hero-title">Burns <img class="hero-strip" src="assets/flame.jpg" alt="a candle flame" width="1920" height="1277"> for <span data-hours>68</span> hours.</h1>
    <p class="hero-lede">Small-batch candles, poured by hand. Every one is sold by how long it burns.</p>
    <div class="scent-picker" role="group" aria-label="Choose a scent">
      <button class="scent-chip" type="button" aria-pressed="true" data-scent data-hours="68" data-notes="cedarwood, smoked vanilla, black pepper">Cedar Ember</button>
      <button class="scent-chip" type="button" aria-pressed="false" data-scent data-hours="60" data-notes="fig leaf, sea salt, bergamot">Fig &amp; Sea Salt</button>
      <button class="scent-chip" type="button" aria-pressed="false" data-scent data-hours="72" data-notes="rosemary, lemon peel, cedar">Wild Rosemary</button>
      <button class="scent-chip" type="button" aria-pressed="false" data-scent data-hours="80" data-notes="beeswax, oat milk, warm honey">Honey Oat</button>
      <button class="scent-chip" type="button" aria-pressed="false" data-scent data-hours="64" data-notes="iris root, violet, dark musk">Midnight Iris</button>
      <button class="scent-chip" type="button" aria-pressed="false" data-scent data-hours="64" data-notes="pine needle, wet stone, cold air">Rain on Pine</button>
    </div>
    <p class="scent-note" data-scent-note aria-live="polite">Cedar Ember: cedarwood, smoked vanilla, black pepper.</p>
    <a class="button hero-action" href="#scents">Shop the scents</a>
  </section>
</main>

<footer class="site-footer">
</footer>
</body>
</html>
